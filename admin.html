<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkPro 管理后台</title>
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      padding: 16px;
    }
    input, textarea, select, button {
      font-size: 1rem;
      font-family: inherit;
    }

    /* ========== Layout ========== */
    .admin-wrap {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .admin-left { min-width: 0; }
    .admin-right { min-width: 0; }

    /* ========== Header ========== */
    .admin-header {
      text-align: center;
      padding: 24px 0 20px;
    }
    .admin-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .admin-header .sub {
      font-size: 0.85rem;
      color: #888;
      margin-top: 4px;
    }

    /* ========== Section Cards ========== */
    .section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    /* ========== Form ========== */
    .form-row {
      margin-bottom: 14px;
    }
    .form-row label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 4px;
      color: #555;
    }
    .form-row input[type="text"],
    .form-row input[type="url"],
    .form-row input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-row input:focus {
      border-color: #ff4757;
    }

    /* ========== Color Pickers Row ========== */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .color-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-item label {
      flex-shrink: 0;
      font-size: 0.8rem;
      color: #555;
      min-width: 52px;
    }
    .color-item input[type="color"] {
      width: 44px;
      height: 36px;
      padding: 2px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
    }
    .color-item .hex-val {
      font-size: 0.8rem;
      color: #888;
      font-family: monospace;
    }

    /* ========== Product List ========== */
    .product-list { list-style: none; }
    .product-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .product-item:last-child { border-bottom: none; }

    .product-item .thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      background: #eee;
      flex-shrink: 0;
    }
    .product-item .info {
      flex: 1;
      min-width: 0;
    }
    .product-item .info .title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .product-item .info .meta {
      font-size: 0.78rem;
      color: #999;
      margin-top: 2px;
    }
    .product-item .sort-badge {
      font-size: 0.75rem;
      background: #f0f2f5;
      padding: 2px 10px;
      border-radius: 10px;
      color: #666;
      white-space: nowrap;
    }
    .product-item .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ========== Buttons ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: #ff4757;
      color: #fff;
    }
    .btn-secondary {
      background: #f0f2f5;
      color: #333;
    }
    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }
    .btn-success {
      background: #27ae60;
      color: #fff;
    }
    .btn-sm {
      padding: 5px 12px;
      font-size: 0.82rem;
      border-radius: 6px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    /* ========== Modal ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px 20px 20px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* ========== Toast ========== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 24px;
      border-radius: 24px;
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    /* ========== Empty State ========== */
    .empty-state {
      text-align: center;
      padding: 24px;
      color: #aaa;
      font-size: 0.9rem;
    }

    /* ========== JSON Preview Panel ========== */
    .json-preview {
      height: fit-content;
    }
    .json-preview .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .json-preview .section-title .badge {
      font-size: 0.72rem;
      font-weight: 400;
      color: #999;
      background: #f0f2f5;
      padding: 2px 10px;
      border-radius: 10px;
    }
    .json-preview .json-content {
      background: #1e1e2e;
      color: #cdd6f4;
      border-radius: 8px;
      padding: 16px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      overflow: auto;
      max-height: 55vh;
      white-space: pre;
      tab-size: 2;
      word-break: normal;
      word-wrap: normal;
    }
    .json-preview .json-content .placeholder {
      color: #6c7086;
      font-style: italic;
    }
    .json-preview .btn-row {
      margin-top: 12px;
    }
    .json-preview .btn-row .btn {
      flex: 1;
    }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      .admin-wrap {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 480px) {
      body { padding: 10px; }
      .section { padding: 16px; }
      .color-grid { grid-template-columns: 1fr; }
      .product-item { flex-wrap: wrap; }
      .product-item .thumb { width: 48px; height: 48px; }
      .btn-row .btn { flex: 1; }
    }
  </style>
</head>
<body>

<div class="admin-wrap">

  <!-- ===== Left Column: Forms ===== -->
  <div class="admin-left">

    <!-- Header -->
    <div class="admin-header">
      <h1>LinkPro 管理后台</h1>
      <div class="sub">编辑数据 → 生成 JSON → 替换本地文件 → 推送部署</div>
    </div>

    <!-- Section: Brand & Theme -->
    <div class="section">
      <div class="section-title">品牌与主题</div>
      <div class="form-row">
        <label>品牌名称</label>
        <input type="text" id="brandName" placeholder="例：Get Lucky" />
      </div>
      <div class="color-grid">
        <div class="color-item">
          <label>背景色</label>
          <input type="color" id="bgColor" value="#f8f9fa" />
          <span class="hex-val" id="bgColorHex">#f8f9fa</span>
        </div>
        <div class="color-item">
          <label>卡片色</label>
          <input type="color" id="cardBg" value="#ffffff" />
          <span class="hex-val" id="cardBgHex">#ffffff</span>
        </div>
        <div class="color-item">
          <label>文字色</label>
          <input type="color" id="textColor" value="#1a1a2e" />
          <span class="hex-val" id="textColorHex">#1a1a2e</span>
        </div>
        <div class="color-item">
          <label>主题色</label>
          <input type="color" id="primaryColor" value="#ff4757" />
          <span class="hex-val" id="primaryColorHex">#ff4757</span>
        </div>
      </div>
    </div>

    <!-- Section: Products -->
    <div class="section">
      <div class="section-title">商品管理</div>
      <ul class="product-list" id="productList"></ul>
      <div style="margin-top:12px;">
        <button class="btn btn-primary" id="btnAdd">+ 添加商品</button>
      </div>
    </div>

    <!-- Section: Actions -->
    <div class="section">
      <div class="section-title">数据操作</div>
      <p style="font-size:0.85rem;color:#888;margin-bottom:12px;">
        点击「生成 JSON」在右侧预览，确认后可复制或下载替换 <code>data/profile.json</code>，然后 git commit + push 即可自动部署。
      </p>
      <div class="btn-row">
        <button class="btn btn-success" id="btnExport">📥 生成 JSON</button>
        <button class="btn btn-secondary" id="btnReset">🔄 重置为示例数据</button>
      </div>
    </div>

  </div>
  <!-- ===== Left Column End ===== -->

  <!-- ===== Right Column: JSON Preview ===== -->
  <div class="admin-right">
    <div class="section json-preview" id="jsonPreviewSection">
      <div class="section-title">
        JSON 预览
        <span class="badge" id="jsonCharCount">0 字符</span>
      </div>
      <div class="json-content" id="jsonPreviewContent"><span class="placeholder">点击左侧「生成 JSON」按钮预览</span></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnCopyJSON">📋 复制 JSON</button>
        <button class="btn btn-success" id="btnDownloadJSON">📥 下载 JSON</button>
      </div>
    </div>
  </div>
  <!-- ===== Right Column End ===== -->

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">添加商品</div>
    <div class="form-row">
      <label>商品标题</label>
      <input type="text" id="formTitle" placeholder="请输入商品标题" />
    </div>
    <div class="form-row">
      <label>商品图片 URL</label>
      <input type="url" id="formImage" placeholder="https://example.com/image.jpg" />
    </div>
    <div class="form-row">
      <label>购买链接 URL</label>
      <input type="url" id="formUrl" placeholder="https://example.com/buy/123" />
    </div>
    <div class="form-row">
      <label>排序数字 <span style="font-weight:400;color:#999;">（越大越靠前，留空按创建时间）</span></label>
      <input type="number" id="formSort" placeholder="留空自动按时间排序" />
    </div>
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-primary" id="formSave" style="flex:1;">保存</button>
      <button class="btn btn-secondary" id="formCancel">取消</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  (function() {
    // ========== State ==========
    let data = null;          // full data object
    let editingId = null;     // null = add, string = edit

    // ========== DOM refs ==========
    const $ = id => document.getElementById(id);
    const brandName      = $('brandName');
    const bgColor        = $('bgColor');
    const cardBg         = $('cardBg');
    const textColor      = $('textColor');
    const primaryColor   = $('primaryColor');
    const bgColorHex     = $('bgColorHex');
    const cardBgHex      = $('cardBgHex');
    const textColorHex   = $('textColorHex');
    const primaryColorHex= $('primaryColorHex');
    const productList    = $('productList');
    const btnAdd         = $('btnAdd');
    const btnExport      = $('btnExport');
    const btnReset       = $('btnReset');

    const jsonPreviewContent = $('jsonPreviewContent');
    const jsonCharCount      = $('jsonCharCount');
    const btnCopyJSON        = $('btnCopyJSON');
    const btnDownloadJSON    = $('btnDownloadJSON');

    const modal          = $('modal');
    const modalTitle     = $('modalTitle');
    const formTitle      = $('formTitle');
    const formImage      = $('formImage');
    const formUrl        = $('formUrl');
    const formSort       = $('formSort');
    const formSave       = $('formSave');
    const formCancel     = $('formCancel');

    const toast          = $('toast');
    let toastTimer       = null;

    // ========== Utility ==========
    function uuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function toastShow(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ========== Color picker sync ==========
    function syncColorHex(input, hexEl) {
      input.addEventListener('input', () => { hexEl.textContent = input.value; });
    }
    syncColorHex(bgColor, bgColorHex);
    syncColorHex(cardBg, cardBgHex);
    syncColorHex(textColor, textColorHex);
    syncColorHex(primaryColor, primaryColorHex);

    // ========== Load / Init data ==========
    function initData(source) {
      if (source) {
        data = JSON.parse(JSON.stringify(source));
      } else {
        data = {
          "profile": { "name": "好物推荐", "avatar": "", "bio": "" },
          "links": [
            { "id": uuid(), "title": "智能蓝牙耳机 Pro Max", "image": "https://picsum.photos/seed/p1/600/400", "url": "https://example.com/p1", "sortOrder": 3, "createdAt": new Date().toISOString() },
            { "id": uuid(), "title": "便携式充电宝 20000mAh", "image": "https://picsum.photos/seed/p2/600/400", "url": "https://example.com/p2", "sortOrder": 2, "createdAt": new Date().toISOString() },
            { "id": uuid(), "title": "舒适人体工学椅", "image": "https://picsum.photos/seed/p3/600/400", "url": "https://example.com/p3", "sortOrder": 1, "createdAt": new Date().toISOString() },
            { "id": uuid(), "title": "极简桌面收纳套装", "image": "https://picsum.photos/seed/p4/600/400", "url": "https://example.com/p4", "sortOrder": 0, "createdAt": new Date().toISOString() }
          ],
          "theme": {
            "bgColor": "#f8f9fa",
            "cardBg": "#ffffff",
            "textColor": "#1a1a2e",
            "primaryColor": "#ff4757"
          }
        };
      }
      applyDataToUI();
      renderList();
    }

    // ========== Data → UI ==========
    function applyDataToUI() {
      brandName.value = data.profile.name || '';
      bgColor.value = data.theme.bgColor || '#f8f9fa';
      cardBg.value = data.theme.cardBg || '#ffffff';
      textColor.value = data.theme.textColor || '#1a1a2e';
      primaryColor.value = data.theme.primaryColor || '#ff4757';
      bgColorHex.textContent = bgColor.value;
      cardBgHex.textContent = cardBg.value;
      textColorHex.textContent = textColor.value;
      primaryColorHex.textContent = primaryColor.value;
    }

    // ========== UI → Data ==========
    function collectUI() {
      data.profile.name = brandName.value.trim() || '好物推荐';
      data.theme.bgColor = bgColor.value;
      data.theme.cardBg = cardBg.value;
      data.theme.textColor = textColor.value;
      data.theme.primaryColor = primaryColor.value;
    }

    // ========== Render Product List ==========
    function renderList() {
      const sorted = getSortedLinks();
      if (sorted.length === 0) {
        productList.innerHTML = '<li class="empty-state">暂无商品，点击上方按钮添加</li>';
        return;
      }
      productList.innerHTML = sorted.map(link => `
        <li class="product-item" data-id="${escapeHtml(link.id)}">
          <img class="thumb" src="${escapeHtml(link.image || '')}" alt="${escapeHtml(link.title)}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23eee%22/></svg>'" />
          <div class="info">
            <div class="title">${escapeHtml(link.title)}</div>
            <div class="meta">${escapeHtml(truncateUrl(link.url))}</div>
          </div>
          <span class="sort-badge">#${link.sortOrder !== undefined && link.sortOrder !== null && link.sortOrder !== '' ? link.sortOrder : '时间'}</span>
          <div class="actions">
            <button class="btn btn-secondary btn-sm btn-edit" data-id="${escapeHtml(link.id)}">编辑</button>
            <button class="btn btn-danger btn-sm btn-delete" data-id="${escapeHtml(link.id)}">删除</button>
          </div>
        </li>
      `).join('');

      // Bind events
      productList.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEdit(btn.dataset.id));
      });
      productList.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', () => deleteLink(btn.dataset.id));
      });
    }

    function truncateUrl(url) {
      if (!url) return '';
      try {
        const u = new URL(url);
        return u.hostname + (u.pathname.length > 20 ? u.pathname.slice(0, 20) + '…' : u.pathname);
      } catch {
        return url.length > 30 ? url.slice(0, 30) + '…' : url;
      }
    }

    // ========== Sort ==========
    function getSortedLinks() {
      const links = data.links || [];
      return links.slice().sort((a, b) => {
        const hasA = a.sortOrder !== undefined && a.sortOrder !== null && a.sortOrder !== '';
        const hasB = b.sortOrder !== undefined && b.sortOrder !== null && b.sortOrder !== '';
        if (hasA && hasB) {
          if (Number(a.sortOrder) !== Number(b.sortOrder)) return Number(b.sortOrder) - Number(a.sortOrder);
        } else if (hasA) return -1;
        else if (hasB) return 1;
        return new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime();
      });
    }

    // ========== Modal (Add / Edit) ==========
    function openAdd() {
      editingId = null;
      modalTitle.textContent = '添加商品';
      formTitle.value = '';
      formImage.value = '';
      formUrl.value = '';
      formSort.value = '';
      modal.classList.add('active');
      formTitle.focus();
    }

    function openEdit(id) {
      const link = data.links.find(l => l.id === id);
      if (!link) return;
      editingId = id;
      modalTitle.textContent = '编辑商品';
      formTitle.value = link.title || '';
      formImage.value = link.image || '';
      formUrl.value = link.url || '';
      formSort.value = link.sortOrder !== undefined && link.sortOrder !== null && link.sortOrder !== '' ? link.sortOrder : '';
      modal.classList.add('active');
      formTitle.focus();
    }

    function saveForm() {
      const title = formTitle.value.trim();
      const image = formImage.value.trim();
      const url   = formUrl.value.trim();
      const sort  = formSort.value.trim();

      if (!title) { toastShow('请输入商品标题'); return; }
      if (!url)   { toastShow('请输入购买链接'); return; }

      collectUI(); // sync theme/brand first

      if (editingId) {
        // Edit existing
        const link = data.links.find(l => l.id === editingId);
        if (link) {
          link.title = title;
          link.image = image;
          link.url = url;
          link.sortOrder = sort !== '' ? Number(sort) : null;
        }
        toastShow('已更新');
      } else {
        // Add new
        data.links.push({
          id: uuid(),
          title: title,
          image: image,
          url: url,
          sortOrder: sort !== '' ? Number(sort) : null,
          createdAt: new Date().toISOString()
        });
        toastShow('已添加');
      }

      closeModal();
      renderList();
    }

    function deleteLink(id) {
      if (!confirm('确定要删除这个商品吗？')) return;
      data.links = data.links.filter(l => l.id !== id);
      renderList();
      toastShow('已删除');
    }

    function closeModal() {
      modal.classList.remove('active');
      editingId = null;
    }

    // ========== Get JSON string from current data ==========
    function getJSONString() {
      collectUI();
      const exportData = JSON.parse(JSON.stringify(data));
      return JSON.stringify(exportData, null, 2);
    }

    // ========== Render JSON Preview ==========
    function renderJSONPreview() {
      const jsonStr = getJSONString();
      jsonPreviewContent.textContent = jsonStr;
      jsonPreviewContent.className = 'json-content'; // remove placeholder style
      jsonCharCount.textContent = `${jsonStr.length} 字符 · ${jsonStr.split('\n').length} 行`;
      toastShow('✅ JSON 已生成，可在右侧预览');
    }

    // ========== Copy JSON ==========
    function copyJSON() {
      const jsonStr = getJSONString();
      navigator.clipboard.writeText(jsonStr).then(() => {
        toastShow('📋 JSON 已复制到剪贴板');
      }).catch(() => {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = jsonStr;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toastShow('📋 JSON 已复制到剪贴板');
      });
    }

    // ========== Download JSON ==========
    function downloadJSON() {
      const jsonStr = getJSONString();
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'profile.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      toastShow('✅ JSON 已下载，替换到 data/profile.json 即可');
    }

    // ========== Reset ==========
    function resetData() {
      if (!confirm('重置将丢失当前编辑的数据，确定吗？')) return;
      initData(null);
      toastShow('已重置为示例数据');
    }

    // ========== Load from file (if available) ==========
    async function loadFromFile() {
      try {
        const res = await fetch('./data/profile.json');
        if (!res.ok) throw new Error('404');
        const json = await res.json();
        // Validate basic shape
        if (json && json.links && Array.isArray(json.links)) {
          initData(json);
          toastShow('已加载现有数据');
        } else {
          initData(null);
        }
      } catch {
        initData(null);
      }
    }

    // ========== Bind Events ==========
    btnAdd.addEventListener('click', openAdd);
    formSave.addEventListener('click', saveForm);
    formCancel.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    btnExport.addEventListener('click', renderJSONPreview);
    btnReset.addEventListener('click', resetData);
    btnCopyJSON.addEventListener('click', copyJSON);
    btnDownloadJSON.addEventListener('click', downloadJSON);

    // Enter key in modal
    [formTitle, formImage, formUrl, formSort].forEach(el => {
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveForm(); }
      });
    });

    // ========== Go ==========
    loadFromFile();
  })();
</script>
</body>
</html>
