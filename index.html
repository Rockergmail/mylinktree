<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">GET LUCKY</title>
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: #f8f9fa;
      color: #1a1a2e;
      transition: background 0.3s, color 0.3s;
    }
    a { text-decoration: none; color: inherit; }

    /* ========== Container ========== */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* ========== Brand Header ========== */
    .brand {
      text-align: center;
      padding: 32px 0 24px;
    }
    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ========== Product Grid ========== */
    .products {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* ========== Product Card ========== */
    .product-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
      display: block;
      cursor: pointer;
    }
    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }
    .product-card:active {
      transform: translateY(0);
    }

    .product-card .image-wrap {
      position: relative;
      width: 100%;
      padding-top: 66.67%; /* 3:2 aspect ratio */
      overflow: hidden;
      background: #eee;
    }
    .product-card .image-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .image-wrap img {
      transform: scale(1.03);
    }

    .product-card .info {
      padding: 16px 18px 18px;
    }
    .product-card .info .title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-card .info .btn-buy {
      display: inline-block;
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      background: #ff4757;
      transition: opacity 0.2s;
    }
    .product-card .info .btn-buy:hover {
      opacity: 0.85;
    }

    /* ========== Footer ========== */
    .footer {
      text-align: center;
      padding: 32px 0 16px;
      font-size: 0.8rem;
      opacity: 0.4;
    }

    /* ========== Loading / Error ========== */
    .loading, .error {
      text-align: center;
      padding: 48px 16px;
      font-size: 1rem;
    }
    .error { color: #e74c3c; }

    /* ========== Responsive ========== */
    @media (min-width: 480px) {
      .container { padding: 32px 24px 48px; }
      .products { gap: 24px; }
    }
    @media (min-width: 640px) {
      .products { grid-template-columns: repeat(2, 1fr); }
      .brand h1 { font-size: 1.8rem; }
    }
    @media (min-width: 960px) {
      .products { grid-template-columns: repeat(3, 1fr); }
      .container { padding: 40px 32px 48px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <h1 id="brandName">My Store</h1>
    </div>
    <div id="loading" class="loading">Loading…</div>
    <div id="error" class="error" style="display:none;"></div>
    <div id="productGrid" class="products" style="display:none;"></div>
    <div class="footer">post.rock.xiang@gmail.com</div>
  </div>

  <script>
    (async function() {
      const $ = id => document.getElementById(id);
      const brandName = $('brandName');
      const grid = $('productGrid');
      const loading = $('loading');
      const errorDiv = $('error');

      try {
        const res = await fetch('./data/profile.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Apply theme
        const t = data.theme || {};
        if (t.bgColor) document.body.style.background = t.bgColor;
        if (t.textColor) document.body.style.color = t.textColor;
        if (t.cardBg) {
          document.querySelectorAll('.product-card').forEach(el => {});
          // we'll apply via style tag for new cards
        }

        // Brand name
        if (data.profile && data.profile.name) {
          brandName.textContent = data.profile.name;
          document.title = data.profile.name;
        }

        // Sort links: sortOrder desc (higher first), then createdAt desc
        const links = (data.links || []).slice().sort((a, b) => {
          const hasA = a.sortOrder !== undefined && a.sortOrder !== null;
          const hasB = b.sortOrder !== undefined && b.sortOrder !== null;
          if (hasA && hasB) {
            if (a.sortOrder !== b.sortOrder) return b.sortOrder - a.sortOrder;
          } else if (hasA) return -1;
          else if (hasB) return 1;
          // fallback to createdAt desc
          return new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime();
        });

        if (links.length === 0) {
          loading.textContent = 'No products yet';
          return;
        }

        // Inject dynamic cardBg style
        if (t.cardBg) {
          const style = document.createElement('style');
          style.textContent = `.product-card { background: ${t.cardBg}; }`;
          document.head.appendChild(style);
        }
        if (t.primaryColor) {
          const style = document.createElement('style');
          style.textContent = `.product-card .info .btn-buy { background: ${t.primaryColor}; }`;
          document.head.appendChild(style);
        }

        // Render cards
        loading.style.display = 'none';
        grid.style.display = 'grid';

        links.forEach(link => {
          const card = document.createElement('a');
          card.className = 'product-card';
          card.href = link.url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          const imgHtml = link.image
            ? `<img src="${escapeHtml(link.image)}" alt="${escapeHtml(link.title)}" loading="lazy" />`
            : '';

          card.innerHTML = `
            <div class="image-wrap">${imgHtml}</div>
            <div class="info">
              <div class="title">${escapeHtml(link.title)}</div>
              <span class="btn-buy">Buy Now</span>
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        loading.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Failed to load. Please try again.';
        console.error(err);
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
